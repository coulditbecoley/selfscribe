[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "selfscribe"
version = "0.1.0"
description = "Self-hosted push-to-talk dictation: hotkey -> mic -> Whisper -> text at your cursor."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "sounddevice>=0.4.6",
    "numpy>=1.26",
    "webrtcvad-wheels>=2.0.14",
    "pynput>=1.7.6",
    "pyperclip>=1.9.0",
    "pystray>=0.19.5",
    "Pillow>=10.0",
    # macOS: frontmost-app detection + Accessibility check (pynput/pystray pull Quartz)
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=10; sys_platform == 'darwin'",
]

[project.optional-dependencies]
local = ["faster-whisper>=1.0"]
dev = ["pytest>=8", "ruff>=0.4"]
build = ["pyinstaller>=6.10"]

[project.scripts]
selfscribe = "selfscribe.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: exercises real external services (Groq/Anthropic/Ollama) or hardware",
]
